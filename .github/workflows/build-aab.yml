name: Build GharKaam AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        env:
          GH_KEYSTORE_BASE64: ${{ secrets.GH_KEYSTORE_BASE64 }}
        run: |
          echo "$GH_KEYSTORE_BASE64" | base64 --decode > gharkaam-upload-key.jks

      - name: Build signed AAB
        env:
          GH_KEYSTORE_PASSWORD: ${{ secrets.GH_KEYSTORE_PASSWORD }}
          GH_KEY_ALIAS: ${{ secrets.GH_KEY_ALIAS }}
          GH_KEY_PASSWORD: ${{ secrets.GH_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/gharkaam-upload-key.jks" \
            -Pandroid.injected.signing.store.password="$GH_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$GH_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$GH_KEY_PASSWORD"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: GharKaam-release-AAB
          path: app/build/outputs/bundle/release/*.aab
